<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Digital | Aprender</title>
    <link rel="stylesheet" href="./css/aprender.css" />
    <link rel="stylesheet" href="./css/account-preferences.css" />
      <link rel="stylesheet" href="./css/site-header.css" />
      <link rel="stylesheet" href="./css/acessibilidade.css" />
  </head>
  <body class="learning-page learning-home-page">
    <header class="topbar" data-site-header data-active="aprender" data-search-id="learningSearch" data-search-placeholder="Buscar conteúdo..."></header>
    <script src="./scripts/site-header.js"></script>

    <main class="container page-shell">
      <section class="page-header learning-home-header">
        <h1>Central de Aprendizado</h1>
        <p>Escolha uma trilha e avance curso por curso, no seu ritmo.</p>
      </section>

      <section class="learning-section" id="catalogo">
        <div class="section-head">
          <div class="section-title">
            <h2>Trilhas</h2>
          </div>
          <span class="learning-trail-count" id="catalogSummary">Carregando catálogo...</span>
        </div>
        <div class="trail-overview-grid" id="catalogGrid"></div>
      </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="./scripts/supabase-config.js"></script>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/data.js"></script>
    <script src="./scripts/account.js"></script>
    <script src="./scripts/home-data.js"></script>
    <script src="./aprender/materias/catalogo/contas-dispositivos.js"></script>
    <script src="./aprender/materias/catalogo/golpes.js"></script>
    <script src="./aprender/materias/catalogo/privacidade-familia.js"></script>
    <script src="./aprender/materias/catalogo/trabalho.js"></script>
    <script src="./aprender/materias/catalogo/tecnico.js"></script>
    <script src="./scripts/aprender.js"></script>
    <script src="./scripts/catalogo-aprender.js"></script>
  </body>
</html>
