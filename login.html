<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Digital | Login</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="./index.html" class="brand brand-light">
            <img src="./assets/logo.png" alt="Olho Digital" />
            <span>Olho Digital</span>
          </a>
          <h1>Bem-vindo de volta</h1>
          <p>Faça login para continuar</p>
        </div>

        <form id="loginForm" novalidate>
          <div id="errorBox" class="error-box hidden"></div>

          <label>
            <span>Email</span>
            <input type="email" id="email" placeholder="seu@email.com" required />
          </label>

          <label>
            <span>Senha</span>
            <input type="password" id="password" placeholder="••••••••" required />
          </label>

          <button type="submit" class="primary-btn block">Entrar</button>
        </form>

        <p class="switch-link">
          Não tem uma conta?
          <a href="./register.html">Cadastre-se</a>
        </p>

        <div class="back-link">
          <a href="./index.html">← Voltar para página inicial</a>
        </div>
      </div>
    </div>

    <script src="./scripts/login.js"></script>
  </body>
</html>
