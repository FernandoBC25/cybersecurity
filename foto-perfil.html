<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Olho Digital | Foto de perfil</title>
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/account-preferences.css" />
    <link rel="stylesheet" href="./css/configuracoes.css" />
    <link rel="stylesheet" href="./css/foto-perfil.css" />
      <link rel="stylesheet" href="./css/site-header.css" />
      <link rel="stylesheet" href="./css/acessibilidade.css" />
  </head>
  <body>
    <header class="topbar" data-site-header ></header>
    <script src="./scripts/site-header.js"></script>
    <main class="avatar-page">
      <a class="back-link" href="./home.html">← Voltar ao início</a>
      <p class="eyebrow">PERSONALIZE SUA CONTA</p>
      <h1>Foto de perfil</h1>
      <p class="avatar-intro">Escolha um avatar do Olho Digital ou envie uma imagem sua.</p>

      <section class="avatar-card" aria-labelledby="galleryTitle">
        <h2 id="galleryTitle">Avatares do Olho Digital</h2>
        <div id="avatarGallery" class="avatar-gallery" role="group" aria-label="Escolha um avatar"></div>
      </section>

      <section class="avatar-card upload-card" aria-labelledby="uploadTitle">
        <h2 id="uploadTitle">Enviar imagem própria</h2>
        <p>Formatos aceitos: JPG, PNG e WebP. Tamanho máximo: 5 MB. A imagem será ajustada para um recorte quadrado.</p>
        <div class="upload-actions">
          <label class="upload-button">Selecionar imagem
            <input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" />
          </label>
          <button type="button" class="cancel-upload" id="cancelUpload" hidden>Descartar seleção</button>
        </div>
      </section>

      <section class="avatar-preview-card" aria-labelledby="previewTitle">
        <h2 id="previewTitle">Prévia</h2>
        <img id="avatarPreview" alt="Prévia da foto de perfil selecionada" />
        <p id="avatarStatus" class="form-status" role="status" aria-live="polite"></p>
        <div class="avatar-actions">
          <a class="secondary-button" href="./home.html">Cancelar</a>
          <button type="button" class="primary-button" id="saveAvatar" disabled>Confirmar foto</button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="./scripts/supabase-config.js"></script>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/data.js"></script>
    <script src="./scripts/account.js"></script>
    <script src="./scripts/foto-perfil.js"></script>
  </body>
</html>
