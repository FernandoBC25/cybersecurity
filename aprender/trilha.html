<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Digital | Trilha de aprendizado</title>
    <link rel="stylesheet" href="../css/aprender.css" />
    <link rel="stylesheet" href="../css/account-preferences.css" />
    <link rel="stylesheet" href="../css/site-header.css" />
    <link rel="stylesheet" href="../css/acessibilidade.css" />
  </head>
  <body class="learning-page trail-detail-page">
    <header class="topbar" data-site-header data-active="aprender" data-search-id="learningSearch" data-search-placeholder="Buscar curso..."></header>
    <script src="../scripts/site-header.js"></script>

    <main class="container page-shell trail-detail-page" id="learningTrailDetail">
      <a class="trail-back-link" href="../aprender.html"><span aria-hidden="true">←</span> Voltar às trilhas</a>
      <section class="page-header trail-detail-header" aria-labelledby="trailTitle">
        <span class="trail-detail-icon" id="trailIcon" aria-hidden="true"></span>
        <div class="trail-detail-copy">
          <span class="trail-eyebrow">Trilha de aprendizado</span>
          <h1 id="trailTitle">Carregando trilha...</h1>
          <p id="trailDescription"></p>
        </div>
      </section>
      <section class="trail-progress-summary" aria-label="Progresso da trilha">
        <div class="trail-progress-copy">
          <strong id="trailCourseCount"></strong>
          <span id="trailCompletionCount"></span>
        </div>
        <div class="trail-progress-track" id="trailProgressTrack" role="progressbar" aria-label="Cursos concluídos nesta trilha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="trailProgressBar"></span>
        </div>
      </section>
      <p class="catalog-empty" id="trailNotFound" hidden>Não encontramos essa trilha. Volte à página Aprender para escolher uma trilha disponível.</p>
      <section id="trailContent" aria-label="Cursos da trilha">
        <div class="catalog-filters" id="catalogFilters"></div>
        <div class="course-grid trail-course-grid" id="catalogGrid" role="list" aria-label="Cursos da trilha"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="../scripts/supabase-config.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/data.js"></script>
    <script src="../scripts/account.js"></script>
    <script src="../scripts/home-data.js"></script>
    <script src="./materias/catalogo/contas-dispositivos.js"></script>
    <script src="./materias/catalogo/golpes.js"></script>
    <script src="./materias/catalogo/privacidade-familia.js"></script>
    <script src="./materias/catalogo/trabalho.js"></script>
    <script src="./materias/catalogo/tecnico.js"></script>
    <script src="../scripts/aprender.js"></script>
    <script src="../scripts/catalogo-aprender.js"></script>
  </body>
</html>
