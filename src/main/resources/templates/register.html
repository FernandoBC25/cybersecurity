<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Digital | Cadastro</title>
    <link rel="stylesheet" href="./register.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="./index.html" class="brand brand-light">
            <img src="../src/imports/Logo_Olho_Digital.png" alt="Olho Digital" />
            <span>Olho Digital</span>
          </a>
          <h1>Criar sua conta</h1>
          <p>Junte-se à comunidade de segurança digital</p>
        </div>

        <form id="registerForm" novalidate>
          <div id="errorBox" class="error-box hidden"></div>

          <label>
            <span>Nome completo</span>
            <input type="text" id="name" placeholder="João Silva" required />
          </label>

          <label>
            <span>Email</span>
            <input type="email" id="email" placeholder="seu@email.com" required />
          </label>

          <label>
            <span>Senha</span>
            <input type="password" id="password" placeholder="••••••••" required />
          </label>

          <label>
            <span>Confirmar senha</span>
            <input type="password" id="confirmPassword" placeholder="••••••••" required />
          </label>

          <button type="submit" class="primary-btn block">Criar conta</button>
        </form>

        <p class="switch-link">
          Já tem uma conta?
          <a href="./login.html">Fazer login</a>
        </p>

        <div class="back-link">
          <a href="./index.html">← Voltar para página inicial</a>
        </div>
      </div>
    </div>

    <script src="./register.js"></script>
  </body>
</html>
